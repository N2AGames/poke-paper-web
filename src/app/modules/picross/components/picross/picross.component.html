<div id="container">
    <div id="game-container">
        <div id="game-title-container">
            <button class="return-button" (click)="return()"><mat-icon>arrow_back</mat-icon></button>
            <div id="game-title">Picross</div>
            <button class="info-button" (click)="openInstructions = true">?</button>
        </div>
        @if (!modeSelected) {
            <div id="mode-config">Select Mode</div>
            <div id="mode-selection">
                <button class="config-btn" (click)="selectMode('5x5')">5x5</button>
            </div>
            <div id="mode-selection">
                <button class="config-btn" (click)="selectMode('10x10')">10x10</button>
            </div>
            <div id="mode-selection">
                <button class="config-btn" (click)="selectMode('15x15')">15x15</button>
            </div>
            <div id="mode-selection">
                <button class="config-btn" (click)="selectMode('20x20')">20x20</button>
            </div>
        } @else {
            <div id="live-container">
                @for(live of lives; track $index) {
                    <span class="mdi mdi-pokeball pokeball" [style.color]="live ? '#ff4081' : 'transparent'"></span>
                }
            </div>
            <picross-board [rows]="rows" [columns]="cols" [action]="action"></picross-board>
            @if(!isGameFinished()) {
                <div class="action-btns">
                    <button id="guess-btn" class="toggle-btn" [class.active]="action === 'guess'" (click)="changeAction('guess')"><mat-icon>edit</mat-icon></button>
                    <button id="mark-btn" class="toggle-btn" [class.active]="action === 'mark'" (click)="changeAction('mark')"><mat-icon>flag</mat-icon></button>
                    <button id="reset-btn" (click)="reset()"><mat-icon>refresh</mat-icon></button>
                </div>
                <button id="mode-btn" (click)="changeMode()">Change mode</button>
            } @else {
                <div id="result-message">{{ picrossBoard.resultMessage }}</div>
                <div class="action-btns">
                    <button id="mode-btn" (click)="reload()">Try another Pokémon</button>
                    <button id="mode-btn" (click)="changeMode()">Change mode</button>
                </div>
            }
        }
    </div>
</div>

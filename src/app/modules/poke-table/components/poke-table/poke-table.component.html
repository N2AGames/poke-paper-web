<div id="container">
    <div id="game-container">
        <div id="game-title-container">
            <button class="return-button" (click)="return()"><mat-icon>arrow_back</mat-icon></button>
            <div id="game-title">PokeTable</div>
            <button class="info-button" (click)="openInstructions = true">?</button>
        </div>
        @if(!modeSelected) {
            <div id="mode-config">Select Mode</div>
            <div id="mode-selection">
                <button class="config-btn" (click)="selectMode('daily')">Daily table</button>
            </div>
        } @else {
            <poke-table-board [mode]="selectedMode" (gameFinished)="onGameFinished()"></poke-table-board>
            @if(!gameFinishedState) {
                <button id="mode-btn" (click)="changeMode()">Change mode</button>
                <button id="mode-btn" (click)="reload(true)">New table</button>
            } @else {
                <div id="result-message">¡Tablero completado! ¡Felicidades!</div>
                <div class="action-btns">
                    <button id="mode-btn" (click)="reload()">Nueva partida</button>
                    <button id="mode-btn" (click)="changeMode()">Change mode</button>
                </div>
            }
        }
        <app-score
            [mode]="'poke-table'"
            [scoreType]="scoreEventType"
            [scoreTick]="scoreEventTick"
            [showScore]="showScore"
        ></app-score>
    </div>
</div>

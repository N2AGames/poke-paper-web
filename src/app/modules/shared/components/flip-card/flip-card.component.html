<div class="card-container" [style.width]="size">
    <div class="card" [class.is-flipped]="isFlipped()" [class.is-revealing]="isRevealing()" [class.is-fully-revealed]="isFullyRevealed() && doubleTrouble">
        <div class="card-face card-front">
            <img src="imgs/reverso_carta.png" class="back-template">
        </div>
        <div class="card-face card-back">
            <img #fondoCartaImg [src]="fondoCarta" class="back-template">
            <!-- Pokémon revelados (detrás) -->
            @for (imgSrc of cardInfo.imgsSrc; track i; let i = $index) {
                <img [src]="imgSrc" [style.width.%]="pokePorcentaje" class="back-content back-content-revealed" [class.reveal-position]="isFullyRevealed()" [attr.data-index]="i"/>
            }
            <!-- Pokémon sombreados (adelante) -->
            @for (imgSrc of cardInfo.imgsSrc; track i; let i = $index) {
                @if (checkShadowed(i)) {
                    <img [src]="imgSrc" [style.width.%]="pokePorcentaje" class="back-content back-content-shadowed"/>
                }
            }
            @if(showPokeName) {
                <div class="back-text">
                    <div class="name-box">
                        <div class="name-left"><img src="imgs/name_box_l.png" alt=""/></div>
                        <div class="name-center">
                            <img src="imgs/name_box.png" alt="" class="name-center-img"/>
                            <div class="text-display name-center-text">{{ cardInfo.title }}</div>
                        </div>
                        <div class="name-right"><img src="imgs/name_box_r.png" alt=""/></div>
                    </div>
                </div>
            }
        </div>
    </div>
</div>

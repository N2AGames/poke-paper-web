<footer id="app-footer">
  <div class="footer-content">
    <div class="footer-section">
      <p class="footer-text">
        <strong>Poke Paper</strong> v{{ version }}
      </p>
      <p class="footer-text">© {{ currentYear }} {{ creator }}</p>
    </div>
    <div class="footer-section">
      <a [href]="repositoryUrl" target="_blank" rel="noopener noreferrer" class="footer-link">
        <img src="imgs/github-logo.svg" alt="GitHub" class="github-logo">
        <span>GitHub</span>
      </a>
    </div>
    <div class="footer-section">
      <p class="footer-text footer-disclaimer">
        Pokémon is a trademark of The Pokémon Company
      </p>
    </div>
  </div>
</footer>
